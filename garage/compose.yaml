name: garage

services:
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    # S3 API (3900) is reached by other containers over the `garage` network.
    # We also bind it to the VPS loopback (127.0.0.1) so a developer can reach
    # it from a local machine through an SSH tunnel for migrations:
    #   ssh -L 3900:127.0.0.1:3900 <vps>
    # 3903 is the admin (API) port — keep it unpublished for security.
    ports:
      - "127.0.0.1:3900:3900"
    networks:
      - garage

volumes:
  garage_meta:
  garage_data:

networks:
  garage:
    name: garage
    driver: bridge
