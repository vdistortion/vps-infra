services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443/tcp'
      - '443:443/udp'
    environment:
      CADDY_INGRESS_NETWORKS: caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
    networks:
      - caddy

volumes:
  caddy_data:

networks:
  caddy:
    external: true
